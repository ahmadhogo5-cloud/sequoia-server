<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ID Extractor</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 14px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}

.searchButton {
    background: #1877f2;
    color: white;
}

.copyButton {
    background: #16a34a;
    color: white;
}

.clearButton {
    background: #dc2626;
    color: white;
}

#status {
    margin-top: 15px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 10px;
}

#count {
    font-weight: bold;
    margin-top: 8px;
}

#results {
    width: 100%;
    height: 450px;
    margin-top: 15px;
    box-sizing: border-box;
    background: #111;
    color: #00ff88;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-family: monospace;
    font-size: 15px;
    direction: ltr;
    text-align: left;
    resize: vertical;
}

</style>

</head>

<body>

<div class="container">

<h2>
ID Extractor
</h2>

<p>
ضع رابط المصدر المسموح للسيرفر بقراءته:
</p>

<input
    type="url"
    id="urlInput"
    placeholder="https://example.com/page"
>

<button
    class="searchButton"
    onclick="extractIDs()"
>
بدء البحث
</button>

<div id="status">
جاهز
</div>

<div id="count">
عدد النتائج: 0
</div>

<textarea
    id="results"
    readonly
    placeholder="ستظهر النتائج هنا..."
></textarea>

<button
    class="copyButton"
    onclick="copyResults()"
>
نسخ جميع النتائج
</button>

<button
    class="clearButton"
    onclick="clearAll()"
>
مسح الكل
</button>

</div>

<script>

async function extractIDs() {

    const urlInput =
        document.getElementById("urlInput");

    const status =
        document.getElementById("status");

    const count =
        document.getElementById("count");

    const results =
        document.getElementById("results");

    const url =
        urlInput.value.trim();


    if (!url) {

        status.textContent =
            "يرجى إدخال رابط";

        return;
    }


    status.textContent =
        "جاري جلب المصدر والبحث...";

    count.textContent =
        "عدد النتائج: 0";

    results.value =
        "";


    try {

        const response =
            await fetch(
                "/api/extract",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        url: url
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "حدث خطأ أثناء البحث"
            );
        }


        const ids =
            Array.isArray(data.ids)
            ? data.ids
            : [];


        const output =
            ids
            .map(
                id => "@" + id
            )
            .join("\n");


        results.value =
            output;


        count.textContent =
            "عدد النتائج: "
            +
            ids.length.toLocaleString();


        status.textContent =
            "تم استخراج جميع النتائج";

    }

    catch (error) {

        status.textContent =
            "خطأ: "
            +
            error.message;

    }

}



async function copyResults() {

    const results =
        document.getElementById("results");


    if (!results.value) {

        alert(
            "لا توجد نتائج للنسخ"
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            results.value
        );

        alert(
            "تم نسخ جميع النتائج"
        );

    }

    catch {

        results.select();

        document.execCommand(
            "copy"
        );

        alert(
            "تم نسخ جميع النتائج"
        );

    }

}



function clearAll() {

    document
        .getElementById("urlInput")
        .value = "";


    document
        .getElementById("results")
        .value = "";


    document
        .getElementById("count")
        .textContent =
        "عدد النتائج: 0";


    document
        .getElementById("status")
        .textContent =
        "جاهز";

}

</script>

</body>

</html>
